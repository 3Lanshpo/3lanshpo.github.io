<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" default="default">
  <meta name="apple-mobile-web-app-title" content="全科导学">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="六年级全科导学：语数英、奥数、信息学的知识点闭环学习系统">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>全科导学系统</title>
  <link rel="stylesheet" href="app.css?v=20261122a">
</head>

<body>

  <!-- 启动 -->
  <div class="screen active" id="screen-boot">
    <div class="boot">正在加载…</div>
  </div>

  <!-- 登录 -->
  <div class="screen" id="screen-auth">
    <div class="auth-wrap">
      <div class="auth-brand">
        <div class="auth-logo">导</div>
        <h1 class="auth-title">全科导学系统</h1>
      </div>

      <div class="segmented" id="auth-tabs">
        <button type="button" data-mode="password" class="on">密码登录</button>
        <button type="button" data-mode="code">验证码登录</button>
        <button type="button" data-mode="signup">注册</button>
      </div>

      <div class="form-error" id="auth-error"></div>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="auth-email">邮箱</label>
          <input type="email" id="auth-email" placeholder="parent@example.com" autocomplete="email"
            inputmode="email">
        </div>

        <div class="field" id="field-password">
          <label for="auth-password">密码</label>
          <input type="password" id="auth-password" placeholder="密码" autocomplete="current-password">
        </div>

        <div class="field" id="field-code" style="display:none">
          <label for="auth-code">邮箱验证码</label>
          <div class="code-row">
            <input type="text" id="auth-code" placeholder="6 位数字" inputmode="numeric" autocomplete="one-time-code">
            <button type="button" id="btn-send-code">获取验证码</button>
          </div>
        </div>

        <button type="submit" class="btn" id="auth-submit">登录</button>
      </form>

      <div class="auth-links">
        <button type="button" id="btn-forgot">忘记密码</button>
      </div>

      <p class="hint" id="auth-hint">家长注册一个邮箱账号即可，孩子用同一个账号在手机上登录。</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div class="screen" id="screen-main">
    <div class="appbar">
      <div style="flex:1;min-width:0">
        <h1 id="main-title">今日任务</h1>
        <div class="sub" id="main-sub"></div>
      </div>
      <a class="icon-btn" href="./hw/" title="硬件工程师导学系统" aria-label="硬件工程师导学系统"
        style="display:inline-flex;align-items:center;justify-content:center;color:inherit;text-decoration:none">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2 2.3-2.3z" />
        </svg>
      </a>
      <button class="icon-btn" id="btn-me" type="button" aria-label="我的">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </button>
    </div>
    <div class="page" id="main-page"></div>
    <nav class="tabbar" id="tabbar">
      <button type="button" data-tab="today" class="on">
        <svg class="glyph" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
        今日任务
      </button>
      <button type="button" data-tab="map">
        <svg class="glyph" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        知识图谱
      </button>
      <button type="button" data-tab="reading">
        <svg class="glyph" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="11" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0" />
          <path d="M12 18v4M8.5 22h7" />
        </svg>
        英语跟读
      </button>
      <button type="button" data-tab="bank">
        <svg class="glyph" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
        题库刷练
      </button>
      <button type="button" data-tab="lab">
        <svg class="glyph" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 2v6.5L4.5 18a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8.5V2" />
          <path d="M8.5 2h7" />
          <path d="M7 15h10" />
        </svg>
        虚拟实验室
      </button>
      <button type="button" data-tab="wrong">
        <svg class="glyph" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M15 9l-6 6M9 9l6 6" />
        </svg>
        错题本
      </button>
      <button type="button" data-tab="board">
        <svg class="glyph" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20h18" />
          <path d="M6 20V10M12 20V4M18 20v-7" />
        </svg>
        学习看板
      </button>
    </nav>
  </div>

  <!-- 二级页：我的 / 课程设置 / 管理中心 / 错题导入 / 重做 -->
  <div class="screen" id="screen-sub">
    <div class="appbar">
      <button class="icon-btn" id="sub-back" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <div style="flex:1;min-width:0">
        <h1 id="sub-title">我的</h1>
        <div class="sub" id="sub-sub"></div>
      </div>
    </div>
    <div class="page no-tab" id="sub-page"></div>
  </div>

  <!-- 学习页 -->
  <div class="screen" id="screen-learn">
    <div class="appbar">
      <button class="icon-btn" id="learn-back" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <div style="flex:1;min-width:0">
        <h1 id="learn-title">学习</h1>
        <div class="sub" id="learn-sub"></div>
      </div>
    </div>
    <div class="page no-tab" id="learn-page"></div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <link rel="stylesheet" href="katex/katex.min.css">
  <script defer src="katex/katex.min.js"></script>
  <script defer src="katex/auto-render.min.js"></script>
  <script src="config.js?v=20261122a"></script>
  <script src="api.js?v=20261122a"></script>
  <script src="ui.js?v=20261122a"></script>
</body>

</html>
